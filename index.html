  .gate-foot{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:var(--fs-xs); color:rgba(255,255,255,.55); }
  .gate-cargando{ display:inline-flex; align-items:center; gap:10px; } .gate-cargando i{ width:14px; height:14px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:girar .8s linear infinite; } @keyframes girar{ to{ transform:rotate(1turn); } }
  @media (max-width:600px){ .gate-centro{ padding:22px 0; } .user-card{ min-width:calc(50% - 5px); padding-right:10px; } .gate-tag{ display:none; } }
  @media (prefers-reduced-motion: reduce){ .portada-luz{ animation:none; } .por-anillo{ animation:none; opacity:.5; } .gate-cargando i{ animation:none; } }
  .gate-form{ display:flex; flex-direction:column; gap:10px; width:100%; }
  .gate-form input{ width:100%; font-size:16px; padding:11px 12px; }
  .pin-error{ color:var(--danger); font-size:13px; min-height:18px; }
  .gate-note{ color:var(--ink-soft); font-size:13px; margin:0; }
  .gate .gate-note{ color:rgba(255,255,255,.74); }
  .kard-sub{ font-size:12px; color:var(--ink-soft); }
  .pay-toggle{ display:flex; gap:6px; flex-wrap:wrap; }
  .pay-opt{ flex:1; min-width:80px; background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:9px 8px; font-weight:600; font-size:13px; color:var(--ink-soft); }
  .pay-opt.on{ background:var(--sel); color:var(--sel-ink); border-color:var(--sel); }
  .chk{ display:flex; align-items:center; gap:8px; font-size:var(--fs-md); margin:4px 0 12px; cursor:pointer; }
  .chk input{ width:18px; height:18px; }
  .cat-list{ display:flex; flex-direction:column; gap:6px; }
  .cat-item{ display:flex; align-items:center; gap:8px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-sm); padding:6px 8px 6px 12px; }
  .cat-item span{ flex:1; }
  .print-hide{}
</style>
