  th{ text-align:left; font-size:12px; font-weight:600; color:var(--ink-soft); padding:8px 8px; border-bottom:2px solid var(--line-strong); white-space:nowrap; }

  .pos{ color:var(--ok); } .negv{ color:var(--danger); }

  .viz .tick{ font-size:11px; fill:var(--ink-soft); font-family:"IBM Plex Sans",system-ui,sans-serif; }
