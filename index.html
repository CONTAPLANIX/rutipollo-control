  .foto-mini{ width:38px; height:38px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:pointer; }
  .foto-prev{ max-width:100%; max-height:200px; border-radius:8px; border:1px solid var(--line); display:block; margin-top:6px; }
  .toast{ position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:999px; font-size:13px; box-shadow:var(--shadow-lg); z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show{ opacity:1; }
  .note{ font-size:12.5px; color:var(--ink-soft); background:var(--paper-alt); border-radius:var(--r-sm); padding:10px 12px; margin:10px 0; line-height:1.5; }
  .note.warn{ background:var(--warn-bg); color:var(--warn); }
  .note.ok{ background:var(--ok-bg); color:var(--ok); }
  .note.danger{ background:var(--danger-bg); color:var(--danger); }
  .diff-big{ font-family:"IBM Plex Mono",monospace; font-size:30px; font-weight:600; }

  .overlay{ position:fixed; inset:0; background:rgba(9,45,88,.45); z-index:40; display:flex; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto; }
  .modal{ background:var(--paper); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); width:100%; max-width:560px; padding:22px; border:1px solid var(--line); }
  .modal.wide{ max-width:820px; }
  .modal h2{ font-size:19px; margin-bottom:12px; }
  .actions-row{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:14px; }
  .actions-row .sp{ flex:1; }
  .gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 16px; gap:14px; text-align:center; }
  .gate-logo{ width:96px; height:96px; object-fit:contain; border-radius:22px; background:#fff; padding:8px; box-shadow:var(--shadow); }
  .gate-form{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; }
  .gate-form input{ width:100%; font-size:16px; padding:11px 12px; }
  .user-grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; max-width:440px; }
  .user-chip{ background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:999px; padding:12px 20px; font-weight:600; font-size:15px; box-shadow:var(--shadow-sm); }
  .user-chip:hover{ border-color:var(--accent); color:var(--accent); }
  .pin-error{ color:var(--danger); font-size:13px; min-height:18px; }
  .gate-note{ color:var(--ink-soft); font-size:13px; margin:0; }
  .kard-sub{ font-size:12px; color:var(--ink-soft); }
  .pay-toggle{ display:flex; gap:6px; flex-wrap:wrap; }
  .pay-opt{ flex:1; min-width:80px; background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:9px 8px; font-weight:600; font-size:13px; color:var(--ink-soft); }
  .pay-opt.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .chk{ display:flex; align-items:center; gap:8px; font-size:13.5px; margin:4px 0 12px; cursor:pointer; }
  .chk input{ width:18px; height:18px; }
  .cat-list{ display:flex; flex-direction:column; gap:6px; }
  .cat-item{ display:flex; align-items:center; gap:8px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-sm); padding:6px 8px 6px 12px; }
  .cat-item span{ flex:1; }
  .print-hide{}
</style>
