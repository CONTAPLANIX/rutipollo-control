  td.num,th.num{ text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.tot td{ font-weight:700; border-top:2px solid var(--line-strong); background:var(--paper-alt); }
  tr.click{ cursor:pointer; } tr.click:hover td{ background:var(--paper-alt); }
  .pos{ color:var(--ok); } .negv{ color:var(--danger); }
  .bar-mini{ height:8px; background:var(--paper-alt); border-radius:0 4px 4px 0; overflow:hidden; min-width:60px; }
  .bar-mini i{ display:block; height:100%; background:var(--s2); border-radius:0 4px 4px 0; }
  .bar-mini.ok i{ background:var(--s1); }
  .viz{ position:relative; }
  .viz svg{ display:block; width:100%; height:auto; }
  .viz .grid{ stroke:var(--grid); stroke-width:1; }
  .viz .base{ stroke:var(--line-strong); stroke-width:1; }
  .viz .tick{ font-size:11px; fill:var(--ink-soft); font-family:"IBM Plex Sans",system-ui,sans-serif; }
  .viz .tick.dir{ font-weight:600; fill:var(--ink); }
  .viz .hit{ fill:transparent; }
  .viz .hit:hover, .viz .hit.on{ fill:rgba(9,45,88,.06); }
  .viz-tip{ position:absolute; pointer-events:none; background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); padding:8px 10px; font-size:12px; display:none; z-index:5; min-width:150px; color:var(--ink); }
  .viz-tip .t{ font-weight:600; margin-bottom:4px; }
  .viz-tip .r{ display:flex; justify-content:space-between; gap:12px; padding:1px 0; }
  .viz-tip .r b{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; }
  .viz-tip .k{ display:inline-block; width:12px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .stack{ display:flex; height:16px; border-radius:5px; overflow:hidden; gap:2px; margin:6px 0 10px; }
  .stack i{ display:block; height:100%; min-width:3px; }
  .spark{ width:130px; height:30px; display:block; margin-top:6px; }
  .meter{ height:10px; background:var(--paper-alt); border-radius:6px; overflow:hidden; margin:6px 0 4px; }
  .meter i{ display:block; height:100%; background:var(--s1); border-radius:6px; }
  .meter.ok i{ background:var(--ok); } .meter.warn i{ background:var(--s4); }
  .aviso{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
  .aviso:last-child{ border-bottom:none; } .aviso .ic{ font-size:17px; line-height:1.2; }
  .aviso .sub{ font-size:12px; color:var(--ink-soft); }
  .tag{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--paper-alt); color:var(--ink-soft); white-space:nowrap; }
  .tag.efectivo{ background:#e4f4e9; color:#1d7a3e; } .tag.banco{ background:#e1ecfb; color:#1f4f9c; } .tag.yape{ background:#f1e3f7; color:#742284; } .tag.plin{ background:#dcf5f3; color:#049a91; }
  .tag.cat{ background:var(--warn-bg); color:var(--warn); }
  body.oscuro .tag.efectivo{ background:rgba(95,207,135,.16); color:#8fe3ad; } body.oscuro .tag.banco{ background:rgba(57,135,229,.2); color:#9ec5f4; } body.oscuro .tag.yape{ background:rgba(144,133,233,.2); color:#c4bdf5; } body.oscuro .tag.plin{ background:rgba(25,158,112,.2); color:#7fe0c0; }
  body.oscuro .tag{ background:rgba(255,255,255,.08); color:var(--ink-soft); }
  .viz circle, .spark circle{ stroke:var(--paper-raised); }
  .spark circle{ stroke:var(--band); }
  body.oscuro .leaflet-tile{ filter:brightness(.72) contrast(1.05) saturate(.7); }
  body.oscuro .leaflet-control-attribution, body.oscuro .leaflet-bar a{ background:#182432; color:#c3c2b7; } body.oscuro .leaflet-popup-content-wrapper, body.oscuro .leaflet-popup-tip{ background:#182432; color:#eef2f7; }
  body.oscuro .eq::after{ background:radial-gradient(closest-side, rgba(255,122,31,.22), transparent); }
  body.oscuro .cal rect.dia:hover{ stroke:#fff; }
  .tag.merma{ background:var(--danger-bg); color:var(--danger); }
  .empty{ color:var(--ink-soft); font-size:13px; padding:14px 0; text-align:center; }
  .chart-card svg{ display:block; }
  .legend{ display:flex; gap:14px; font-size:12px; color:var(--ink-soft); margin-bottom:6px; flex-wrap:wrap; }
  .legend i{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-2px; }
  .bar-label{ font-size:11px; fill:var(--ink-soft); } .bar-value{ font-size:10px; fill:var(--ink-soft); } .axis-line{ stroke:var(--line-strong); stroke-width:1; }
  .foto-mini{ width:38px; height:38px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:pointer; }
  .foto-prev{ max-width:100%; max-height:200px; border-radius:8px; border:1px solid var(--line); display:block; margin-top:6px; }
  .toast{ position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:999px; font-size:13px; box-shadow:var(--shadow-lg); z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show{ opacity:1; }
  .note{ font-size:12.5px; color:var(--ink-soft); background:var(--paper-alt); border-radius:var(--r-sm); padding:10px 12px; margin:10px 0; line-height:1.5; }
  .note.warn{ background:var(--warn-bg); color:var(--warn); }
  .note.ok{ background:var(--ok-bg); color:var(--ok); }
  .note.danger{ background:var(--danger-bg); color:var(--danger); }
  .diff-big{ font-family:"IBM Plex Mono",monospace; font-size:30px; font-weight:600; }

  .overlay{ position:fixed; inset:0; background:rgba(9,45,88,.45); z-index:40; display:flex; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto; }
  .modal{ background:var(--paper); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); width:100%; max-width:560px; padding:22px; border:1px solid var(--line); }
  .modal.wide{ max-width:820px; }
  .modal h2{ font-size:19px; margin-bottom:12px; }
  .actions-row{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:14px; }
  .actions-row .sp{ flex:1; }
  .gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 16px; gap:14px; text-align:center; }
  .gate-logo{ width:96px; height:96px; object-fit:contain; border-radius:22px; background:#fff; padding:8px; box-shadow:var(--shadow); }
  .gate-form{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; }
  .gate-form input{ width:100%; font-size:16px; padding:11px 12px; }
  .user-grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; max-width:440px; }
  .user-chip{ background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:999px; padding:12px 20px; font-weight:600; font-size:15px; box-shadow:var(--shadow-sm); }
  .user-chip:hover{ border-color:var(--accent); color:var(--accent); }
  .pin-error{ color:var(--danger); font-size:13px; min-height:18px; }
  .gate-note{ color:var(--ink-soft); font-size:13px; margin:0; }
  .kard-sub{ font-size:12px; color:var(--ink-soft); }
  .pay-toggle{ display:flex; gap:6px; flex-wrap:wrap; }
  .pay-opt{ flex:1; min-width:80px; background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:9px 8px; font-weight:600; font-size:13px; color:var(--ink-soft); }
  .pay-opt.on{ background:var(--sel); color:var(--sel-ink); border-color:var(--sel); }
  .chk{ display:flex; align-items:center; gap:8px; font-size:13.5px; margin:4px 0 12px; cursor:pointer; }
  .chk input{ width:18px; height:18px; }
  .cat-list{ display:flex; flex-direction:column; gap:6px; }
  .cat-item{ display:flex; align-items:center; gap:8px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-sm); padding:6px 8px 6px 12px; }
  .cat-item span{ flex:1; }
  .print-hide{}
</style>
</head>
